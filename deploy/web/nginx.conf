server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Resolving through a variable defers the lookup to
    # request time, so this container starts even when api is down or restarting.
    # A literal upstream is resolved at config load and would abort startup.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8081;

    location /v1 {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /healthz {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
