# The whole local stack, in one file:
#
#   docker compose up -d
#
# It used to be two. docker-compose.app.yaml existed so infrastructure could be
# brought up and provisioned first, because an operator had to read the OpenFGA
# store and model identifiers out of a provisioning run and paste them into
# .env before the application would start. OpenFGA is embedded now and resolves
# both in process, so there is no phase boundary and nothing to record.
#
# Local development only. Every credential and key defaulted here is a
# throwaway matching .env.example, including CREDENTIAL_ENCRYPTION_KEY, which is
# duplicated there. Never point a real deployment at these values.
name: tflive-compose
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${APP_DB_USER:-tflive}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:-tflive}
      POSTGRES_DB: ${APP_DB_NAME:-tflive_test}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:-keycloak}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak-local-only}
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME:-keycloak}
      TEMPORAL_DB_USER: ${TEMPORAL_DB_USER:-temporal}
      TEMPORAL_DB_PASSWORD: ${TEMPORAL_DB_PASSWORD:-temporal}
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/init.sh:/docker-entrypoint-initdb.d/10-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_DB_USER:-tflive} -d ${APP_DB_NAME:-tflive_test}"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.3
    command: start-dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak-local-only}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:-tflive-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:-tflive-admin-local-only}
      KC_HTTP_PORT: "8082"
      KC_HOSTNAME: http://keycloak.localhost:8082
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    ports:
      - "8082:8082"
    networks:
      default:
        aliases:
          - keycloak.localhost
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          { printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&0;
          grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  keycloak-provision:
    build:
      context: .
      dockerfile: Dockerfile.keycloak-provisioner
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      KEYCLOAK_ADMIN_URL: http://keycloak:8082
      KEYCLOAK_ADMIN_REALM: master
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:-tflive-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:-tflive-admin-local-only}
      KEYCLOAK_REALM: tflive
      KEYCLOAK_API_CLIENT_ID: tflive-api
      # The provisioner derives the confidential client's redirect and
      # post-logout URIs from TFLIVE_PUBLIC_URL, and registers this exact
      # secret on the client, so the API and the IdP always agree.
      TFLIVE_PUBLIC_URL: ${TFLIVE_PUBLIC_URL:-http://localhost:5173}
      # Back-channel logout is a server-to-server POST from Keycloak's own
      # container, not a browser redirect — TFLIVE_PUBLIC_URL resolves inside
      # Keycloak to Keycloak's own loopback, not the host's browser-facing
      # port, so this is pinned to the API's address on the Compose network.
      TFLIVE_BACKCHANNEL_LOGOUT_URL: http://api:8081/v1/auth/backchannel-logout
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-tflive-api-local-only}
      KEYCLOAK_PLATFORM_ADMIN_USERNAME: ${KEYCLOAK_PLATFORM_ADMIN_USERNAME:-tflive-platform-admin}
      KEYCLOAK_PLATFORM_ADMIN_PASSWORD: ${KEYCLOAK_PLATFORM_ADMIN_PASSWORD:-tflive-platform-admin-local-only}
      KEYCLOAK_PLATFORM_ADMIN_EMAIL: ${KEYCLOAK_PLATFORM_ADMIN_EMAIL:-tflive-platform-admin@local.test}
      KEYCLOAK_PLATFORM_ADMIN_FIRST_NAME: ${KEYCLOAK_PLATFORM_ADMIN_FIRST_NAME:-tflive}
      KEYCLOAK_PLATFORM_ADMIN_LAST_NAME: ${KEYCLOAK_PLATFORM_ADMIN_LAST_NAME:-Platform Administrator}
      KEYCLOAK_HTTP_TIMEOUT: 10s
      TFLIVE_ENVIRONMENT: ${TFLIVE_ENVIRONMENT:-development}
    restart: "no"

  temporal:
    image: temporalio/auto-setup:1.28.1
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: ${TEMPORAL_DB_USER:-temporal}
      POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD:-temporal}
      # temporal and temporal_visibility are pre-created by deploy/postgres/init.sh
      # with the temporal role as owner. The temporal role intentionally has no
      # CREATEDB privilege on the shared server, so auto-setup must not attempt
      # its own CREATE DATABASE step (it otherwise only skips that step for the
      # main DB when DBNAME equals POSTGRES_USER, which never holds for the
      # visibility database).
      SKIP_DB_CREATE: "true"
    ports:
      - "7233:7233"
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  temporal-ui:
    profiles: ["debug"]
    image: temporalio/ui:2.49.1
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000,http://localhost:8080
    ports:
      - "8080:8080"

  minio:
    profiles: ["s3"]
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-tflive}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-tflive-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    profiles: ["s3"]
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-tflive} ${MINIO_ROOT_PASSWORD:-tflive-secret}; do
        sleep 1;
      done;
      mc mb --ignore-existing local/${S3_BUCKET:-tflive-artifacts}
      "

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
      keycloak-provision:
        condition: service_completed_successfully
    environment:
      HTTP_ADDRESS: ":8081"
      DATABASE_URL: postgres://${APP_DB_USER:-tflive}:${APP_DB_PASSWORD:-tflive}@postgres:5432/${APP_DB_NAME:-tflive_test}?sslmode=disable
      TEMPORAL_ADDRESS: temporal:7233
      TFLIVE_ENVIRONMENT: development
      TFLIVE_TENANT_ID: ${TFLIVE_TENANT_ID:-tenant_123}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-717cb4d0fd1db07a30442806c2987599580f6d7c6e63b9bddf509bc183a086d3}
      OIDC_ISSUER_URL: http://keycloak.localhost:8082/realms/tflive
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-tflive-api}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-tflive-api-local-only}
      TFLIVE_PUBLIC_URL: ${TFLIVE_PUBLIC_URL:-http://localhost:5173}
      SESSION_ENCRYPTION_KEY: ${SESSION_ENCRYPTION_KEY:-b6f1d2c4a8e0937516243b8c5d7e9f0a1b2c3d4e5f60718293a4b5c6d7e8f9a0}
      ARTIFACT_STORE_KIND: filesystem
      ARTIFACT_STORE_FILESYSTEM_ROOT: /var/lib/tflive/artifacts
      # Template sync runs in the API's control-plane worker and clones private
      # repositories with an installation token.
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      # Seeds the bootstrap administrator on first boot. Required by the API --
      # without it the process exits at startup and the service restart-loops.
      # Defaulted here because this file is the local stack; a real deployment
      # sets it from the environment like every other secret.
      TFLIVE_ROOT_PASSWORD: ${TFLIVE_ROOT_PASSWORD:-root-local-only}
    restart: on-failure
    ports:
      - "8081:8081"
    volumes:
      - artifacts:/var/lib/tflive/artifacts

  # The data plane. It runs tenant Terraform, so it gets no database URL and no
  # key: secrets arrive sealed to a per-run key, and results go back to the API
  # through Temporal. Add nothing here a template must not read.
  executor:
    build:
      context: .
      dockerfile: Dockerfile.executor
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      ARTIFACT_STORE_KIND: filesystem
      ARTIFACT_STORE_FILESYSTEM_ROOT: /var/lib/tflive/artifacts
      EXECUTOR_RUN_ROOT: /var/lib/tflive/runs
    restart: on-failure
    volumes:
      - artifacts:/var/lib/tflive/artifacts

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    depends_on:
      - api
    restart: on-failure
    ports:
      - "5173:5173"

volumes:
  postgres-data:
  minio-data:
  artifacts:
