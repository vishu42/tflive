# Local development only. Every credential and key defaulted in this file is a
# throwaway matching .env.example, including CREDENTIAL_ENCRYPTION_KEY, which is
# duplicated there. Never point a real deployment at these values.
name: tflive-compose
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${APP_DB_USER:-tflive}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:-tflive}
      POSTGRES_DB: ${APP_DB_NAME:-tflive_test}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:-keycloak}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak-local-only}
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME:-keycloak}
      OPENFGA_DB_USER: ${OPENFGA_DB_USER:-openfga}
      OPENFGA_DB_PASSWORD: ${OPENFGA_DB_PASSWORD:-openfga-local-only}
      OPENFGA_DB_NAME: ${OPENFGA_DB_NAME:-openfga}
      TEMPORAL_DB_USER: ${TEMPORAL_DB_USER:-temporal}
      TEMPORAL_DB_PASSWORD: ${TEMPORAL_DB_PASSWORD:-temporal}
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/init.sh:/docker-entrypoint-initdb.d/10-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_DB_USER:-tflive} -d ${APP_DB_NAME:-tflive_test}"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.3
    command: start-dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak-local-only}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:-tflive-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:-tflive-admin-local-only}
      KC_HTTP_PORT: "8082"
      KC_HOSTNAME: http://tflive.localhost:8082
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    ports:
      - "8082:8082"
    networks:
      default:
        aliases:
          - tflive.localhost
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          { printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&0;
          grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  keycloak-provision:
    build:
      context: .
      dockerfile: Dockerfile.keycloak-provisioner
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      KEYCLOAK_ADMIN_URL: http://keycloak:8082
      KEYCLOAK_ADMIN_REALM: master
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:-tflive-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:-tflive-admin-local-only}
      KEYCLOAK_REALM: tflive
      KEYCLOAK_WEB_CLIENT_ID: tflive-web
      KEYCLOAK_API_CLIENT_ID: tflive-api
      KEYCLOAK_WEB_REDIRECT_URIS: ${KEYCLOAK_WEB_REDIRECT_URIS:-http://localhost:5173/auth/callback,http://127.0.0.1:5173/auth/callback}
      KEYCLOAK_WEB_ORIGINS: ${KEYCLOAK_WEB_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      KEYCLOAK_PLATFORM_ADMIN_USERNAME: ${KEYCLOAK_PLATFORM_ADMIN_USERNAME:-tflive-platform-admin}
      KEYCLOAK_PLATFORM_ADMIN_PASSWORD: ${KEYCLOAK_PLATFORM_ADMIN_PASSWORD:-tflive-platform-admin-local-only}
      KEYCLOAK_PLATFORM_ADMIN_EMAIL: ${KEYCLOAK_PLATFORM_ADMIN_EMAIL:-tflive-platform-admin@local.test}
      KEYCLOAK_PLATFORM_ADMIN_FIRST_NAME: ${KEYCLOAK_PLATFORM_ADMIN_FIRST_NAME:-tflive}
      KEYCLOAK_PLATFORM_ADMIN_LAST_NAME: ${KEYCLOAK_PLATFORM_ADMIN_LAST_NAME:-Platform Administrator}
      KEYCLOAK_HTTP_TIMEOUT: 10s
      KEYCLOAK_DIRECTORY_READER_CLIENT_SECRET: ${KEYCLOAK_DIRECTORY_READER_CLIENT_SECRET:-somerandsomesecret}
      TFLIVE_ENVIRONMENT: ${TFLIVE_ENVIRONMENT:-development}
    restart: "no"

  openfga-migrate:
    image: openfga/openfga:v1.15.1
    command: migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://${OPENFGA_DB_USER:-openfga}:${OPENFGA_DB_PASSWORD:-openfga-local-only}@postgres:5432/${OPENFGA_DB_NAME:-openfga}?sslmode=disable
    restart: "no"

  openfga:
    image: openfga/openfga:v1.15.1
    command: run
    depends_on:
      openfga-migrate:
        condition: service_completed_successfully
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://${OPENFGA_DB_USER:-openfga}:${OPENFGA_DB_PASSWORD:-openfga-local-only}@postgres:5432/${OPENFGA_DB_NAME:-openfga}?sslmode=disable
      OPENFGA_LOG_FORMAT: json
      OPENFGA_PLAYGROUND_ENABLED: "false"
    ports:
      - "8083:8080"
      - "8084:8081"
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=localhost:8081"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  openfga-provision:
    build:
      context: .
      dockerfile: Dockerfile.openfga-provisioner
    command: ["bootstrap"]
    depends_on:
      openfga:
        condition: service_healthy
    environment:
      OPENFGA_API_URL: http://openfga:8080
      OPENFGA_STORE_NAME: tflive
      OPENFGA_ID_OUTPUT_DIR: /run/openfga
      OPENFGA_STORE_ID_FILE: /run/openfga/store_id
      OPENFGA_MODEL_ID_FILE: /run/openfga/model_id
      OPENFGA_HTTP_TIMEOUT: ${OPENFGA_HTTP_TIMEOUT:-10s}
      OPENFGA_API_TOKEN: ${OPENFGA_API_TOKEN:-}
    volumes:
      - openfga-ids:/run/openfga
    restart: "no"

  temporal:
    image: temporalio/auto-setup:1.28.1
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: ${TEMPORAL_DB_USER:-temporal}
      POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD:-temporal}
      # temporal and temporal_visibility are pre-created by deploy/postgres/init.sh
      # with the temporal role as owner. The temporal role intentionally has no
      # CREATEDB privilege on the shared server, so auto-setup must not attempt
      # its own CREATE DATABASE step (it otherwise only skips that step for the
      # main DB when DBNAME equals POSTGRES_USER, which never holds for the
      # visibility database).
      SKIP_DB_CREATE: "true"
    ports:
      - "7233:7233"
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  temporal-ui:
    profiles: ["debug"]
    image: temporalio/ui:2.49.1
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000,http://localhost:8080
    ports:
      - "8080:8080"

  minio:
    profiles: ["s3"]
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-tflive}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-tflive-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    profiles: ["s3"]
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-tflive} ${MINIO_ROOT_PASSWORD:-tflive-secret}; do
        sleep 1;
      done;
      mc mb --ignore-existing local/${S3_BUCKET:-tflive-artifacts}
      "

volumes:
  postgres-data:
  minio-data:
  openfga-ids:
  artifacts:
